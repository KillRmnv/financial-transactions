# Production overrides. Everything here is a value that differs from the default because the default is
# wrong in production, not because it reads better on a screen.
spring:
  config:
    activate:
      on-profile: prod

  threads:
    # Left off on purpose. Virtual threads on Tomcat move the bottleneck to the JDBC pool: requests become
    # unbounded while the pool stays at ten connections, so latency gets worse rather than better and the
    # cause is not obvious from a dashboard. Turning it on is a change that needs the pool sized, the
    # dashboards rewritten and the runbooks updated, so it is a decision rather than a flag.
    virtual:
      enabled: false

  lifecycle:
    # How long a shutdown waits for in-flight requests before they are cut. Paired with
    # server.shutdown: graceful below, and sized against the database: a request holding
    # PESSIMISTIC_WRITE on a limit row has to finish, not be interrupted.
    timeout-per-shutdown-phase: 30s

  datasource:
    hikari:
      # How long a transaction waits for a row lock before giving up. PostgreSQL's default is 0, which
      # means "forever", and under contention that is worse than slow: the request holds a Tomcat thread,
      # a pool connection and a client socket while nothing is going to release the row.
      #
      # It applies to every lock wait in the session, not only ours — including the one in the flight's
      # own insert of a default limit, and the one Flyway may hit on a DDL lock. Both are the same
      # bargain: a bounded wait that fails visibly rather than an unbounded one that disappears.
      #
      # Prod only. In tests it stays 0 so that a concurrency scenario fails on a wrong flag rather than
      # on a timeout, which would make the flakiness depend on how loaded the machine is.
      connection-init-sql: SET lock_timeout = '3s'

      # The pool and the thread count below are one decision with two numbers, and neither is right on
      # its own. The pool is the scarce resource: twenty connections, because every request that touches
      # the flag holds one while it does, and a contended one holds it longer waiting on the row lock.
      maximum-pool-size: 20
      minimum-idle: 5
      # A second, not five. This is the honest end of the road: past it the caller is told the service is
      # busy instead of being parked for five seconds and then told the same thing. With the thread count
      # below, a second is long enough for a connection that is about to be returned and short enough that
      # a pile-up does not turn into a queue of blocked threads holding client sockets.
      connection-timeout: 1000
      # A connection that has been idle longer than this is not coming back. Without it a database that
      # restarted leaves the pool holding sockets nobody will notice until the next request needs one.
      max-lifetime: 600000
      # Must be lower than max-lifetime, and it is a trap rather than a rule: Hikari silently disables
      # an idle-timeout that is at or above max-lifetime and logs a warning that looks like advice
      # about something else. Five minutes leaves the margin.
      idle-timeout: 300000
      # Asks the database whether a pooled connection is still alive. Without it a connection the
      # database dropped while it was idle survives in the pool until its lifetime expires, and the
      # request that draws it gets a connection error instead of a fresh connection.
      keepalive-time: 30000

springdoc:
  # Off here and on everywhere else, because springdoc warns about it on every production start and is
  # right to: /v3/api-docs describes the whole internal surface, including the paths a client never sees.
  # The specification asks for the API to be documented, which it is — open the UI in the `dev` profile,
  # or set this back to true where publishing it is a deliberate decision rather than a default.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  # Let in-flight requests finish. The default is immediate, which for this service means cutting a
  # request off while it holds a row lock: the transaction rolls back, the client sees a 500, and the
  # deployment that caused the restart looks like the outage did.
  shutdown: graceful
  tomcat:
    # Forty for twenty connections, and the reasoning is the same as the pool's timeout. The default is
    # two hundred, which means a hundred and eighty threads can be alive doing nothing but waiting for a
    # connection — each holding a stack and a client socket, and each making the failure arrive slower
    # and less legibly than it otherwise would. Twice the pool leaves room for requests that never reach
    # the database, such as the health probe, and no room for a pile-up to hide in.
    threads:
      max: 40
      min-spare: 10
    # A client that opens a connection and sends nothing holds a thread until this expires. Five seconds
    # is the default and is generous for a JSON API.
    connection-timeout: 5s
    accept-count: 50

logging:
  level:
    com.idfinance.financial_transactions: INFO
    # Hibernate's statement log is off by default: it is a firehose, not a diagnostic, and the useful
    # version of the same information is the slow-query log on the database.
    org.hibernate.SQL: WARN

management:
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      # Lets a single dashboard hold several deployments without re-labelling anything.
      environment: ${DEPLOYMENT_ENVIRONMENT:production}
