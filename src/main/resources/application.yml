spring:
  application:
    name: financial-transactions
  jpa:
    # Without this the EntityManager stays open for the whole request and a lazy relation fetched in a
    # view sneaks a query into rendering.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        # Liveness and readiness as separate endpoints, which is what an orchestrator asks for. The
        # readiness probe includes the database, so a pod is not sent traffic before Flyway has run.
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true

app:
  # One setting turns the schedulers off. In the test contexts this is mandatory: otherwise the
  # daily sweep and the weekly currency import are registered in every @SpringBootTest, and a test
  # that happens to be alive in the right hour starts calling the external API.
  scheduling:
    enabled: true
    # A cron expression, in the Spring six-field form, for the ISO 4217 import. The default is
    # one call a week, which is what the rate at which new codes appear justifies; an operator
    # who wants to see a new code sooner on a free endpoint lowers it to daily, and one who
    # declines to pay for the listing switches scheduled_job off instead.
    weekly-currency-import:
      cron: "0 30 4 * * MON"

  month-timezone: UTC

  default-limit-sum: 1000.00

  ledger:
    currency-code: USD
    # Decimal places of a money amount.
    amount-scale: 2


  # This is a cache, not a second source of truth: the database answers on its own, and an
  # unreachable Redis costs one extra lookup and nothing more. enabled: false skips Redis
  # entirely — every path keeps working, so turning it off in an environment without Redis is safe.
  cache:
    enabled: true
    ttl: 12h
    # Key prefix: a shared Redis should not receive our keys at its root.
    key-prefix: "financial:rate:"

  # The hour the daily rate sweep runs, in the month timezone above.
  #
  # 07:00 is chosen so the sweep never races the provider. The US session closes around 21:00 UTC,
  # and a provider publishes the daily close after that; by 07:00 the value for the day before is
  # already there, so the sweep reads a number instead of learning there is none. Fetching earlier
  # would spend a request on a file that has not appeared yet.
  #
  # The sweep reads the rate for the first day of the month, not for the day it runs on, so the
  # offset to "yesterday's close" does not matter here: the 1st's close has been available for days.
  # It also lands inside the working morning in both markets the specification names.
  scheduled-fetch-hour: 7

  rates:
    source: ${RATES_SOURCE:twelvedata}
    # Empty means no external provider is configured and rates are read from the database only.
    base-url: ${RATES_API_BASE_URL:}
    api-key: ${RATES_API_KEY:}
    connect-timeout: 3s
    read-timeout: 5s
    attempts: 3
    retry-backoff: 500ms
    fallback-days: 10

    # The fallback, asked only when the provider above has no answer. No key and no quota,
    # which is why this is one URL and nothing else — see the note on the two providers in
    # docs/assumptions.md. Empty switches it off, leaving the paid provider as the only one.
    frankfurter:
      base-url: ${FRANKFURTER_API_BASE_URL:https://api.frankfurter.dev}

  # The currencies the daily sweep prefetches rates for live in the currency_pair table, not here:
  # an operator must be able to add or retire one without a release, and every call to the
  # external API is paid for. The table stores the base currency only — the quote comes from
  # app.ledger above, so moving the ledger to another currency does not touch this table.
  #
  # A currency outside this list is not refused: its rate is fetched on demand by the first
  # transaction that needs it. The list decides only what is already warm.
  #
  # Whether the scheduled jobs themselves run is a row in the scheduled_job table, not a property
  # here. @ConditionalOnProperty is evaluated once when the context starts, so a property would
  # mean a restart to switch off something that costs money, and a value in memory would apply to
  # only the replica it was set on. A row is an UPDATE and every replica reads the same one.

  # Request quotas. The annotation on a handler names one of these blocks; the numbers declared on the
  # annotation are only a fallback, so a new limited endpoint is never silently unlimited.
  rate-limits:
    ingestion:
      limit-for-period: 60
      limit-refresh-period: 1s
      retry-after-seconds: 1
    limit-install:
      limit-for-period: 30
      limit-refresh-period: 1s
      retry-after-seconds: 2

logging:
  level:
    com.idfinance.financial_transactions: INFO
