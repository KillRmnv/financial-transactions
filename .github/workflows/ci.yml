name: CI

# Fast path: runs on every push to any branch and on every pull request, so a feature
# branch is checked before it is ever merged rather than only afterwards. Kept
# deliberately small so it stays in the low minutes range; expensive checks live in
# quality.yml.
#
# `push:` with no branch filter is every branch. The concurrency group is keyed on the
# ref, so pushing to a feature branch cancels that branch's earlier run and leaves a
# master run alone.
on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant. True for pushes as
# well as pull requests: the comment above used to claim that while the expression
# under it only ever cancelled the latter.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A composite action is invoked from `steps`, never from `jobs.<id>.uses` — that key
    # is for reusable *workflows*. Pointing it at an action directory produced a run that
    # failed in zero seconds with no jobs at all, and a failure that quick is not one
    # anybody is watching for: it survived from the commit that introduced this pipeline.
    #
    # The action checks out and sets up the JDK itself, so repeating either here would
    # run them twice for no gain.
    steps:
      - uses: ./.github/actions/ci