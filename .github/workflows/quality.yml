name: Quality

# Slow path. These checks take minutes, so they must not sit in front of every commit:
#   - workflow_dispatch  run them on demand from the Actions tab
#   - schedule           nightly catch regressions
#   - push to master     once the code is actually merged
# Pull requests never trigger this workflow; the fast ci.yml gate runs on every branch
# and is enough there.
#
# No paths-ignore: a push touching only this file is exactly the one that has to prove
# the image job still resolves its actions, and an earlier buildx typo sat here for a
# whole push unnoticed because such a push triggered nothing.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [master]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # There is deliberately no separate static-analysis job. SpotBugs and Spotless are
  # both bound to the verify phase in the pom, so the single `./mvnw -B verify` that
  # ci.yml already runs covers them. Running them again here duplicated the work on
  # every push to master without checking anything the fast job had not.
  image:
    name: Build the Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Packaging the jar on the runner and copying it into the image avoids a second
      # full Maven run inside the Docker build.
      - name: Package the application
        run: ./mvnw -B -DskipTests package

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: financial-transactions:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The app refuses to start without a DataSource, so the smoke check needs a real
      # Postgres; Redis is started too because it is on the classpath. Using the network
      # here instead of a service container keeps the job readable.
      - name: Start Postgres and Redis
        run: |
          docker network create financial-smoke
          docker run -d --name smoke-db --network financial-smoke \
            -e POSTGRES_DB=financial -e POSTGRES_USER=financial -e POSTGRES_PASSWORD=financial \
            postgres:16
          docker run -d --name smoke-redis --network financial-smoke redis:7
          for i in $(seq 1 30); do
            docker exec smoke-db pg_isready -U financial -d financial && break
            sleep 2
          done

      - name: Smoke-check the image
        # -m 1g is not decoration: the JVM sizes its heap from the container's limit, so a run without
        # one exercises a configuration nobody deploys. The memory limit here is the deployment's.
        run: |
          docker run -d --name smoke-app --network financial-smoke -p 8080:8080 -m 1g \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://smoke-db:5432/financial \
            -e SPRING_DATASOURCE_USERNAME=financial \
            -e SPRING_DATASOURCE_PASSWORD=financial \
            -e SPRING_DATA_REDIS_HOST=smoke-redis \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DEPLOYMENT_ENVIRONMENT=ci \
            financial-transactions:ci
          for i in $(seq 1 30); do
            if docker exec smoke-app curl -fsS http://localhost:8080/actuator/health; then
              echo
              echo "Image is healthy."
              docker rm -f smoke-app smoke-db smoke-redis
              docker network rm financial-smoke
              exit 0
            fi
            sleep 3
          done
          echo "The application did not become healthy; container logs follow."
          docker logs smoke-app
          docker rm -f smoke-app smoke-db smoke-redis || true
          docker network rm financial-smoke || true
          exit 1

      # The OpenAPI document as a build artifact, so a client has the contract without this
      # server exposing /v3/api-docs. A second container on purpose: the smoke check above runs
      # the profile the deployment actually uses, where api-docs is off, and turning it on there
      # would test a configuration nobody deploys. This one is the `dev` profile on another port.
      #
      # It needs the same databases as the app, and those are still running from the step above.
      - name: Generate the API contract
        run: |
          docker run -d --name docs-app --network financial-smoke -p 8081:8080 \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://smoke-db:5432/financial \
            -e SPRING_DATASOURCE_USERNAME=financial \
            -e SPRING_DATASOURCE_PASSWORD=financial \
            -e SPRING_DATA_REDIS_HOST=smoke-redis \
            -e SPRING_PROFILES_ACTIVE=dev \
            -e DEPLOYMENT_ENVIRONMENT=ci \
            financial-transactions:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8081/v3/api-docs | jq . > openapi.json && break
            sleep 3
          done
          if [ ! -s openapi.json ]; then
            echo "The contract was not produced; container logs follow."
            docker logs docs-app
            exit 1
          fi
          jq -r '.paths | keys[]' openapi.json | sed 's/^/  /'
          docker rm -f docs-app

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-contract
          path: openapi.json
          if-no-files-found: error
          retention-days: 30

      - name: Clean up on failure
        if: failure()
        run: |
          docker rm -f docs-app || true
          docker rm -f smoke-app smoke-db smoke-redis || true
          docker network rm financial-smoke || true